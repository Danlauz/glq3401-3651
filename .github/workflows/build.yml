name: Build et déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  python:
    name: Tests Python + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation de la librairie
        run: pip install -e .[dev,plot,data]

      - name: Ruff
        run: ruff check . || true   # tolérant le temps que la lib mûrisse

      - name: Tests pytest
        run: pytest -v

      - name: Génération des golden vectors
        run: |
          geostat-polymtl-goldens \
            --output scripts/geostat-js/golden_vectors.json

      - uses: actions/upload-artifact@v4
        with:
          name: golden-vectors
          path: scripts/geostat-js/golden_vectors.json

  # ---------------------------------------------------------------------------
  build:
    name: Rendu Quarto
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation de la lib pour Quarto
        run: pip install -e .[all]

      - uses: actions/download-artifact@v4
        with:
          name: golden-vectors
          path: scripts/geostat-js/

      - name: Quarto render
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  # ---------------------------------------------------------------------------
  deploy:
    name: Déploiement GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
