[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --strict-markers --cov=geostat_polymtl --cov-report=term-missing --cov-report=html
markers =
    cas_corrige: cas dérivé d'un corrigé d'exercice brut
    lent: test lent (exclure avec -m 'not lent')
filterwarnings =
    error::geostat_polymtl._exceptions.GeostatNonReproductibleWarning
