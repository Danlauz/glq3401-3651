project:
  type: book
  output-dir: docs
  # Resources copiees telles quelles par Quarto vers docs/ a chaque render.
  # Necessaire pour les widgets unifies (scripts/geostat-js/) et les precalculs
  # Python (_assets/CXX/). Sans cette directive, Quarto ne sert que les CSS/JS
  # explicitement reference dans `include-*-body`.
  resources:
    - ".nojekyll"   # desactive Jekyll -> sert les fichiers _ (indispensable)
    - "scripts/**/*"
    - "_assets/**/*"
    - "exports/**/*"
    # PDF téléchargeables des anciens examens (un PDF par examen)
    - "chapters/examens/pdf/**/*"
    # Fichiers téléchargeables du recueil d'exercices
    - "chapters/exercices/fichiers/**/*"
    # Fichiers de la librairie geostat_polymtl servis aux widgets Pyodide
    # (calcul live dans le navigateur, source unique = la vraie librairie Python).
    # Dependances de la simulation FFT-MA
    - "geostat_polymtl/simulation_methods/GFFTMA.py"
    - "geostat_polymtl/simulation_methods/LU.py"
    - "geostat_polymtl/simulation_methods/SGS.py"
    - "geostat_polymtl/simulation_methods/STBM.py"
    # Krigeage d'indicatrices (chap. 11)
    - "geostat_polymtl/kriging/indicator.py"
    # Simulation categorielle (chap. 13)
    - "geostat_polymtl/categorical/__init__.py"
    - "geostat_polymtl/categorical/truncated_gaussian.py"
    - "geostat_polymtl/categorical/PGS.py"
    - "geostat_polymtl/categorical/SIS.py"
    - "geostat_polymtl/categorical/MPS.py"
    - "geostat_polymtl/cov_func/covar_nu.py"
    - "geostat_polymtl/functional/helper.py"
    # Traitement statistique (chap. 04)
    - "geostat_polymtl/treatment/composite.py"
    - "geostat_polymtl/treatment/degroupement.py"
    - "geostat_polymtl/treatment/deviations.py"
    - "geostat_polymtl/treatment/erreurs.py"
    - "geostat_polymtl/treatment/exploratoire.py"
    # Methodes conventionnelles (chap. 05)
    - "geostat_polymtl/conventional/idw.py"
    - "geostat_polymtl/conventional/polygones.py"
    - "geostat_polymtl/conventional/triangles.py"
    - "geostat_polymtl/conventional/sections.py"
    - "geostat_polymtl/conventional/qualite.py"
    # Variogramme (modeles theoriques + experimental sur grille + scatter)
    - "geostat_polymtl/cov_func/covar.py"
    - "geostat_polymtl/exp_variogram/GeoStatFFT.py"
    - "geostat_polymtl/exp_variogram/scatter.py"
    # Variance de bloc (chap. 08) : quadrature, empirique, imbrique
    # (__init__.py reel garde les imports absolus geostat_polymtl.* utiles
    # pour les usages Python natifs ; pour Pyodide on monte les submodules
    # directement avec un __init__.py vide, voir pyodide_setup.js)
    - "geostat_polymtl/block_variance/quadrature.py"
    - "geostat_polymtl/block_variance/empirique.py"
    - "geostat_polymtl/block_variance/imbrique.py"
    # Krigeage (chap. 09) : cokri + wrappers KS/KO/KU/bloc/VC/systeme
    - "geostat_polymtl/kriging/cokriging.py"
    - "geostat_polymtl/kriging/wrappers.py"
    # Echantillonnage et QA/QC (chap. 03)
    - "geostat_polymtl/sampling/gy.py"
    - "geostat_polymtl/sampling/blancs.py"
    - "geostat_polymtl/sampling/standards.py"
    - "geostat_polymtl/sampling/duplicatas.py"
    - "geostat_polymtl/sampling/densite.py"
    # Donnees synthetiques (chap. 01, 06)
    - "geostat_polymtl/data/blockmodel.py"
    - "geostat_polymtl/data/synthetic.py"
    - "geostat_polymtl/data/ressources.py"
    - "geostat_polymtl/_seed.py"
    - "geostat_polymtl/_exceptions.py"
    # Economics - theorie de Lane (chap. 02). Servis aux widgets Pyodide.
    - "geostat_polymtl/economics/reserves.py"
    - "geostat_polymtl/economics/economics.py"
    # Geometrie d'orientation 3D (annexe A : vecteurs, plans, intersections)
    - "geostat_polymtl/forage/geometrie.py"

  # ---------------------------------------------------------------------------
  # Production des QUATRE sorties du projet :
  #   - PDF + Word COMPLETS du livre  -> produits nativement par `quarto render`
  #     (formats pdf et docx declares plus bas).
  #   - PDF + Word PAR CHAPITRE       -> produits par scripts/build_chapter_exports.py
  #
  # Deux facons de generer les exports par chapitre :
  #
  #   (A) MANUEL (recommande pendant le developpement) :
  #         quarto render                       # livre complet (html+pdf+docx)
  #         python scripts/build_chapter_exports.py   # chapitres pdf+docx
  #       ... ou en une commande :
  #         python scripts/build_all.py
  #
  #   (B) AUTOMATIQUE a chaque `quarto render` : decommenter le hook ci-dessous.
  #       (Le script a une garde anti-recursion et reste tolerant aux erreurs.)
  #       Attention : ralentit chaque rendu (≈ 26 exports supplementaires).
  #
  # post-render:
  #   - python scripts/build_chapter_exports.py

website:
  google-analytics: G-RX555YHK9M # Measurement ID or Tracking ID

