book:
  title: "Géostatistique et géologie minière"
  subtitle: "Première édition"
  search: true
  author:
    - name: Dany Lauzon
      url: https://www.polymtl.ca/expertises/lauzon-dany
      affiliation: Département des génies civil, géologique et des mines<br>Polytechnique Montréal
      affiliation-url: https://www.polymtl.ca/cgm
  date: today
  date-format: YYYY-MM-DD
  reader-mode: false
  page-footer:
    left: |
      Géostatistique et géologie minière
    right: |
      Ce livre a été réalisé avec <a href="https://quarto.org/">Quarto</a>.
  sidebar:
    style: floating
    collapse-level: 1
    search: true
  repo-url: "https://github.com/Danlauz/glq3401-3651"
  repo-actions: [edit, issue]

  chapters:
    - index.qmd
    - preface.qmd

    - part: "Partie I: Géologie minière"
      chapters:
        - chapters/C01/index.qmd
        - chapters/C02/index.qmd
        - chapters/C03/index.qmd
        - chapters/C04/index.qmd
        - chapters/C05/index.qmd

    - part: "Partie II: Géostatistique linéaire"
      chapters:
        - chapters/C06/index.qmd
        - chapters/C07/index.qmd
        - chapters/C08/index.qmd
        - chapters/C09/index.qmd

    - part: "Partie III: Géostatistique non-linéaire"
      chapters:
        - chapters/C10/index.qmd
        - chapters/C11/index.qmd
        - chapters/C12/index.qmd
        - chapters/C13/index.qmd

    - part: "Partie IV: Exercices et examens"
      chapters:
        - chapters/exercices/index.qmd
        - chapters/examens/index.qmd

    - references.qmd


  appendices:
    - chapters/appendix/appendix-a.qmd
    - chapters/appendix/appendix-b.qmd
    - chapters/appendix/appendix-c.qmd
    - chapters/appendix/appendix-d.qmd
    - chapters/appendix/appendix-e.qmd
    - chapters/appendix/notation.qmd


format:
  html:
    include-in-header:
      - text: |
          <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    # Loader des widgets interactifs unifies (scripts/geostat-js/).
    # - loader.js est un module ES (import ...) : charge a la demande chaque
    #   widget .geostat-widget via IntersectionObserver, verifie les golden
    #   vectors, et bascule sur la figure statique en cas d'erreur.
    # - notebook-button.js injecte les boutons de telechargement par chapitre.
    include-after-body:
      - text: |
          <script type="module" src="/scripts/geostat-js/loader.js"></script>
          <script src="/scripts/geostat-js/notebook-button.js" defer></script>
    theme:
      light: cosmo
      dark: darkly
    css:
      - styles/site-polish.css
      - styles/callouts.css
      - styles/exercice.css
      - styles/chapter-downloads.css
      - scripts/geostat-js/style.css
    toc: true
    toc-depth: 3
    toc-title: "Table des matières"
    number-sections: true
    number-equations: true
    number-depth: 2
    code-fold: false
    code-tools:
      source: true
      toggle: true
      caption: "Code"
    code-copy: true
    html-math-method: mathjax
    lang: fr

  pdf:
    documentclass: scrbook
    classoption:
      - twoside
      - open=any
      - headings=big
    papersize: a4
    fontsize: 11pt
    mainfont: "TeX Gyre Termes"
    monofont: "Latin Modern Mono"
    fontdir: fonts
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    colorlinks: true
    linkcolor: navyblue
    urlcolor: navyblue
    citecolor: navyblue
    lang: fr
    header-includes: |
      \usepackage[top=2.5cm, bottom=3cm, inner=3cm, outer=2.5cm, footskip=1cm]{geometry}
      \usepackage{microtype}
      \usepackage[automark]{scrlayer-scrpage}
      \clearpairofpagestyles
      \ohead{\headmark}
      \ofoot[\pagemark]{\pagemark}
      \setkomafont{pageheadfoot}{\normalfont\sffamily\small}
      \addtokomafont{chapter}{\rmfamily\bfseries}
      \definecolor{navyblue}{RGB}{0,0,128}

  docx:
    toc: true
    toc-depth: 3
    number-sections: true
    lang: fr
    reference-doc: styles/quarto-academic-template.docx

engine: jupyter
jupyter: python3

execute:
  enabled: true
  freeze: auto
