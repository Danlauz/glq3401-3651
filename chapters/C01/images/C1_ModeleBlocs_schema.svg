    <circle cx="190" cy="72" r="3.6"/><circle cx="190" cy="98" r="3.6"/><circle cx="190" cy="124" r="3.6"/><circle cx="190" cy="150" r="3.6"/><circle cx="190" cy="176" r="3.6"/><circle cx="190" cy="202" r="3.6"/><circle cx="190" cy="228" r="3.6"/><circle cx="190" cy="254" r="3.6"/><circle cx="190" cy="280" r="3.6"/><circle cx="190" cy="306" r="3.6"/>
    <circle cx="346" cy="72" r="3.6"/><circle cx="346" cy="98" r="3.6"/><circle cx="346" cy="124" r="3.6"/><circle cx="346" cy="150" r="3.6"/><circle cx="346" cy="176" r="3.6"/><circle cx="346" cy="202" r="3.6"/><circle cx="346" cy="228" r="3.6"/><circle cx="346" cy="254" r="3.6"/><circle cx="346" cy="280" r="3.6"/><circle cx="346" cy="306" r="3.6"/>
