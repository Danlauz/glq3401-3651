  <line x1="398" y1="320" x2="398" y2="344" stroke="#111111" stroke-width="1.5"/>
  <text x="398" y="358" text-anchor="middle" font-size="12.5" fill="#222222">1 bloc (p. ex. 15 m)</text>

  <!-- ===== Legende ===== -->
  <text x="560" y="54" font-size="14" font-weight="bold" fill="#222222">Teneur</text>
  <rect x="560" y="64"  width="34" height="30" fill="#bd0026" stroke="#cccccc"/>
  <rect x="560" y="94"  width="34" height="30" fill="#f03b20" stroke="#cccccc"/>
  <rect x="560" y="124" width="34" height="30" fill="#fd8d3c" stroke="#cccccc"/>
  <rect x="560" y="154" width="34" height="30" fill="#fecc5c" stroke="#cccccc"/>
  <rect x="560" y="184" width="34" height="30" fill="#ffffb2" stroke="#cccccc"/>
  <text x="602" y="84"  font-size="12.5" fill="#333333">élevée</text>
  <text x="602" y="204" font-size="12.5" fill="#333333">faible</text>

  <!-- forage dans la legende -->
  <line x1="565" y1="244" x2="565" y2="286" stroke="#2b2b2b" stroke-width="2.5"/>
  <circle cx="565" cy="252" r="3.6" fill="#1a1a1a"/><circle cx="565" cy="265" r="3.6" fill="#1a1a1a"/><circle cx="565" cy="278" r="3.6" fill="#1a1a1a"/>
  <text x="580" y="269" font-size="12.5" fill="#333333">échantillons</text>
  <text x="580" y="285" font-size="12.5" fill="#333333">(forage)</text>
